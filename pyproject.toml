[project]
name = "home-productivity"
version = "0.1.0"
description = "Family organizer for Pedro and Maguy: shared shopping list first, then to-dos, recipes and a meal planner."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/**/*", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's default rule set: real errors (unused or undefined names, syntax) rather than style.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]  # short lambdas and `l` loop names are fine here
